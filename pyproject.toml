[project]
name = "fin-audit-guard-rag"
version = "0.1.0"
description = "Grounded research Q&A over the Picture Perfect Portfolios articles, with built-in auditing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "litellm>=1.106.4",
    "numpy>=2.4.6",
    "openai>=2.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=14.0.0",
    "sentence-transformers>=6.2.0",
    "typer>=0.27.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpha_audit"]

[dependency-groups]
dev = [
    "deepeval>=4.0.9",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "pandas>=3.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["corpus: needs the local corpus, index and cached embedding model"]
